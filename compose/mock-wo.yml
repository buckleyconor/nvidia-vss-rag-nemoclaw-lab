# compose/mock-wo.yml — standalone file (also the dev-machine smoke target).
# VERBATIM contract from 03-build-decisions.md. `demo-net` is the auth-shim
# network (build doc contract) — created by the shim compose in the full
# lab; declared `external` here so this file joins that network rather than
# owning it. Start the shim first (20-start.sh STEP 1 does).
services:
  mock-wo:
    image: mock-wo:lab
    build: ../mock-wo   # relative to THIS file's dir (compose/), not the repo root
    container_name: mock-wo
    ports: ["8090:8090"]
    environment:
      MOCK_WO_DB_PATH: /data/mock-wo/work-orders.db
    volumes:
      - mock-wo-data:/data/mock-wo
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [demo-net]   # same network as the auth-shim (build doc contract)
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g       # within the sizing's ~1–2 GB estimate; CPU-only, no GPU

volumes:
  mock-wo-data:            # per-instance learner state; wiped on VM reset

networks:
  demo-net:
    name: demo-net
    external: true   # created by compose/docker-compose.shim.yml (start order 02)
